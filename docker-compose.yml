# FiberTrack: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fibertrack
      POSTGRES_USER: fibertrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibertrack -d fibertrack"]
      interval: 5s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      FT_DATABASE_URL: postgresql+psycopg://fibertrack:${DB_PASSWORD}@db:5432/fibertrack
      FT_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FT_FRONTEND_DIR: ../frontend
    volumes:
      - ./data:/data:ro          # сюда кладутся xlsx для импорта истории
      - uploads:/app/backend/uploads   # загруженные через программу файлы

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
